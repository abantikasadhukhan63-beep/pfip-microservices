server:
  port: 8083

spring:
  application:
    name: auth-service

  cache:
    type:
      caffeine:
        spec: maximumSize = 10000, expireAfterWrite = 60s

  data:
    redis:
      host: redis #${REDIS_HOST:redis}
      port: 6379 #${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXo=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.pfip.authservice: DEBUG